name: Build portable Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.event.release.tag_name }}") {
            throw "The package version does not match the published release tag."
          }

      - name: Run tests, type checking, and audit
        run: |
          npm test
          npm run typecheck
          npm audit

      - name: Build portable archive
        run: npm run package:windows

      - name: Upload portable archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts -Filter "4NGEL-Portable-Windows-x64-*.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "The portable ZIP was not created."
          }
          gh release upload "${{ github.event.release.tag_name }}" $archive.FullName --clobber
